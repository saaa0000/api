<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Importação do CSS do Bootstrap -->"
     <title>Criar Usuários</title>
</head>
<body>
    <h1>Criar Usuários</h1>

<form id="form-usuario">
        
        <div class="form-group"> 

        <label for=""> Nome </label>
        <input type="text" class="form-control" id=""usuario_nome  
        placeholder = "Digite um nome..."required>

        <label for=""> Email </label>
        <input type="email" class="form-control" id=""usuario_email 
        placeholder = "Digite um email..."required>

        <label for=""> Idade </label>
        <input type="number" class="form-control" id=""usuario_idade
        placeholder = "Digite um idade..."required>
        
        <label for=""> Altura </label>
        <input type="number" class="form-control" id=""usuario_altura
        placeholder = "Digite um altura..."required>
    
    </div>

    <button type="button" class="btn btn-primary"
        onclick="criarUsuário()"> Cadastrar </button>
</form>

</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="criarUsuario.js"></script>
</html>
